[project]
name = "tw-job-hunter"
version = "0.1.0"
description = "104 職缺搜尋與詳情、公司研調（登記資料與社群口碑）的本機 MCP server（研究學習用途，非官方）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "requests>=2.32",
    "tavily-python>=0.8.5",
]

[project.scripts]
tw-job-hunter = "tw_job_hunter.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tw_job_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
