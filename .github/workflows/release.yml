name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          if git rev-parse -q --verify "refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          {
            echo "## What's Changed"
            echo ""
            LOG="$(git log --no-merges --pretty=format:"* %s (%h)" "$RANGE")"
            if [ -n "$LOG" ]; then
              printf '%s\n' "$LOG"
            else
              printf '* Release %s\n' "$TAG"
            fi
            echo ""
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > release_notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release_notes.md
          fi
